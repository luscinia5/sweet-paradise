<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="menu.pageTitle">Menu | Sweet Paradise</title>
  <meta name="description" content="A preview of the Sweet Paradise menu."
        data-i18n-attr="content:menu.metaDescription">
  <meta name="theme-color" content="#FBF8F3">

  <!-- Hides text until the translation loads (avoids an English flash); gives up after 2s -->
  <script>
    document.documentElement.classList.add("i18n-pending");
    setTimeout(function () { document.documentElement.classList.remove("i18n-pending"); }, 2000);
  </script>

  <!-- Favicon -->
  <link rel="icon" href="favicon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16.png">
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="home-link" href="index.html" data-i18n="menu.back">← Home</a>
    <nav class="lang-switch" aria-label="Language" data-i18n-attr="aria-label:common.language">
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="false">ES</button>
    </nav>
  </header>

  <main class="menu">
    <h1 class="menu-title" data-i18n="menu.title">Our Menu</h1>

    <div class="divider" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 1l2.4 8.6L23 12l-8.6 2.4L12 23l-2.4-8.6L1 12l8.6-2.4z" fill="currentColor"/></svg>
      <span></span>
    </div>

    <!-- Cards are built by js/menu.js from MENU_ITEMS -->
    <ul class="menu-grid" id="menu-grid"></ul>
  </main>

  <dialog class="dialog" id="item-dialog" aria-labelledby="dialog-name">
    <button type="button" class="dialog-close" aria-label="Close" data-i18n-attr="aria-label:menu.close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <article class="dialog-card">
      <div class="dialog-media"><img id="dialog-image" alt=""></div>
      <div class="dialog-body">
        <h2 class="dialog-name" id="dialog-name"></h2>
        <p class="dialog-description" id="dialog-description"></p>
      </div>
    </article>
  </dialog>

  <footer class="footer">
    <small>&copy; <span id="year">2026</span> Sweet Paradise</small>
  </footer>

  <script src="js/menu.js" defer></script>
  <script src="js/i18n.js" defer></script>
</body>
</html>
